version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: texmarket_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./Backend
    container_name: texmarket_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/texmarket
      - JWT_SECRET=secret123
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: texmarket_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo-data: