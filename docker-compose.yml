version: '3.8'

services:
 

  backend:
    build: ./Backend
    container_name: texmarket_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/texmarket
      - JWT_SECRET=secret123
    

  frontend:
    build: ./frontend
    container_name: texmarket_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

